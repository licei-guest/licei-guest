<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Тайный гость «Лицей»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<style>
:root {
  --bg: #FFFFFF; --surface-2: #F6F5F3; --ink: #1A1A1A; --muted: #707070; --line: #ECEAE6;
  --accent: #ED272E; --accent-dark: #C81E25; --accent-soft: #FDEBEC; --ok: #1F8A4C; --ok-soft: #E6F4EC; --warn: #B76E00; --warn-soft: #FFF3DC;
  --r: 16px; --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'Manrope', system-ui, -apple-system, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { cursor: default; opacity: .45; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { max-width: 640px; margin: 0 auto; padding-bottom: calc(90px + var(--safe-b)); }
.view { padding: 0 16px 24px; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.hero { background: var(--accent); color: #fff; margin: 0 -16px 18px; padding: 18px 18px 22px; border-radius: 0 0 26px 26px; position: relative; overflow: hidden; }
.hero .logo { width: 86px; height: auto; color: #fff; display: block; }
.hero h1 { font: 600 30px/1.1 var(--serif); margin: 16px 0 2px; }
.hero .sub { opacity: .85; font-size: 13px; }
.hero .ornament { position: absolute; right: -60px; top: -50px; width: 200px; opacity: .12; color: #fff; pointer-events: none; }
.hero .stats { display: flex; gap: 10px; margin-top: 16px; }
.hero .stat { flex: 1; background: rgba(255,255,255,.14); border-radius: 14px; padding: 10px 12px; }
.hero .stat b { display: block; font-size: 22px; line-height: 1.1; }
.hero .stat span { font-size: 12px; opacity: .85; }

.head { display: flex; align-items: center; gap: 10px; padding: 16px 0 12px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
.head h2 { font: 600 26px/1.1 var(--serif); margin: 0; flex: 1; min-width: 0; }
.back { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.sec { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; }

.list { display: grid; gap: 10px; }
.row { display: flex; gap: 12px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; text-align: left; width: 100%; }
.row .ic { width: 42px; height: 42px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; font-size: 19px; flex: none; font-weight: 800; }
.row .tx { flex: 1; min-width: 0; }
.row .tt { font-weight: 600; }
.row .mt { font-size: 13px; color: var(--muted); margin-top: 1px; }
.row .chev { color: #C9C6C0; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.red { background: var(--accent-soft); color: var(--accent-dark); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.empty { color: var(--muted); text-align: center; padding: 30px 10px; font-size: 14px; }
.card { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; background: #fff; }
.card + .card { margin-top: 10px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.note { background: var(--warn-soft); color: #6B4700; border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-top: 12px; }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: var(--accent); color: #fff; font-weight: 700; padding: 14px; border-radius: 14px; font-size: 16px; }
.btn:active { background: var(--accent-dark); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.line { background: #fff; color: var(--accent-dark); border: 1px solid var(--accent-soft); }
.btn + .btn { margin-top: 8px; }
.fchips { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 12px; padding: 0 16px; scrollbar-width: none; }
.fchips::-webkit-scrollbar { display: none; }
.fchip { flex: none; border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; background: #fff; }
.fchip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

/* поля */
label.f { display: block; margin-bottom: 12px; }
label.f > span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
.inp { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 13px; outline: none; font-size: 16px; }
.inp:focus { border-color: var(--accent); background: #fff; }
textarea.inp { min-height: 76px; resize: vertical; }
select.inp { appearance: none; -webkit-appearance: none; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1; min-width: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; font-weight: 700; background: #fff; font-size: 14px; }
.seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }

/* анкета */
.steps { display: flex; gap: 4px; margin: 2px 0 6px; }
.steps i { flex: 1; height: 4px; border-radius: 9px; background: var(--line); }
.steps i.done { background: var(--ink); }
.steps i.cur { background: var(--accent); }
.stepname { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.q { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 10px; scroll-margin-top: 90px; }
.q.miss { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.q .qt { font-weight: 700; display: flex; gap: 8px; }
.q .qt .n { color: var(--muted); font-weight: 600; flex: none; }
.q .qd { font-size: 13px; color: var(--muted); margin: 4px 0 10px; }
.q .qd.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.q .more { font-size: 12px; font-weight: 700; color: var(--accent-dark); margin: -6px 0 10px; }
.yn { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.yn button { border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px; font-weight: 700; font-size: 14px; background: #fff; }
.yn button.y.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.yn button.n.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.yn button.na.on { background: #8A8780; border-color: #8A8780; color: #fff; }
.q .extra { margin-top: 10px; }
.q .tools { display: flex; gap: 14px; margin-top: 8px; font-size: 13px; font-weight: 700; }
.q .tools button { color: var(--accent-dark); }
.photos { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.photos .ph { width: 64px; height: 64px; border-radius: 10px; background: var(--surface-2) center/cover no-repeat; position: relative; display: grid; place-items: center; }
.photos .ph b { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 13px; display: grid; place-items: center; }
.navbar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.96); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + var(--safe-b)); z-index: 20; }
.navbar .in { max-width: 608px; margin: 0 auto; display: flex; gap: 8px; }
.navbar .btn { margin: 0; }
.navbar .btn.ghost { flex: 0 0 34%; }

/* отчёт */
.big { display: flex; align-items: center; gap: 16px; }
.ring { --p: 0; width: 92px; height: 92px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: radial-gradient(closest-side, #fff 78%, transparent 79% 100%), conic-gradient(var(--c, var(--ok)) calc(var(--p) * 1%), var(--line) 0); }
.ring b { font-size: 24px; }
.bars { display: grid; gap: 9px; margin-top: 14px; }
.bar .l { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; }
.bar .t { height: 7px; border-radius: 9px; background: var(--line); overflow: hidden; margin-top: 4px; }
.bar .t i { display: block; height: 100%; border-radius: 9px; }
.it { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.it:first-child { border-top: 0; }
.it .mk { width: 24px; height: 24px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #fff; }
.it .mk.y { background: var(--ok); } .it .mk.n { background: var(--accent); } .it .mk.na { background: #B9B5AE; }
.it .c { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: pre-wrap; }
.it .w { font-size: 11px; color: var(--muted); flex: none; }

.fab { position: fixed; right: max(16px, calc(50% - 304px)); bottom: calc(78px + var(--safe-b)); background: var(--accent); color: #fff; font-weight: 700; padding: 13px 18px; border-radius: 99px; box-shadow: 0 6px 20px rgba(237,39,46,.35); z-index: 21; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.96); backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: var(--safe-b); z-index: 20; }
.tabs nav { display: flex; width: 100%; max-width: 640px; }
.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 0 8px; font-size: 11px; font-weight: 600; color: var(--muted); }
.tabs button .e { font-size: 20px; line-height: 1.2; filter: grayscale(1); opacity: .7; }
.tabs button.on { color: var(--accent); }
.tabs button.on .e { filter: none; opacity: 1; }

.center { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; gap: 14px; }
.center .logo { width: 130px; color: var(--accent); }
.center h2 { font: 600 28px/1.15 var(--serif); margin: 6px 0 0; }
.center p { color: var(--muted); margin: 0; max-width: 320px; }
.center .btn { max-width: 320px; }
.spin { width: 28px; height: 28px; border: 3px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; }
.spin.sm { width: 18px; height: 18px; border-width: 2px; }
@keyframes sp { to { transform: rotate(360deg); } }
.toast { position: fixed; left: 50%; bottom: calc(100px + var(--safe-b)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 50; max-width: 90vw; animation: fade .2s; text-align: center; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; z-index: 60; }
.modal .sheet { background: #fff; width: 100%; max-width: 640px; border-radius: 22px 22px 0 0; padding: 22px 18px calc(18px + var(--safe-b)); animation: up .2s ease; }
.modal img { max-width: 100%; max-height: 70vh; display: block; margin: 0 auto 12px; border-radius: 12px; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal h3 { font: 600 24px var(--serif); margin: 0 0 6px; }
.saved { font-size: 12px; color: var(--muted); text-align: right; margin-top: -6px; }
</style>
</head>
<body>

<script>
'use strict';
const TG = window.Telegram && Telegram.WebApp;
const DEV = (() => { try { return window.parent !== window && window.parent.MG_DEV; } catch (e) { return null; } })();
const API = window.MG_API || '';
const $app = document.getElementById('app');
const logo = () => document.getElementById('logo').innerHTML;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
const initData = DEV ? DEV.initData : (TG && TG.initData) || '';
const uid = (() => { try { return JSON.parse(new URLSearchParams(initData).get('user')).id; } catch (e) { return 'x'; } })();
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const YES = 'Да', NO = 'Нет', NA = 'Не применимо';
const LOADS = ['до 25%', '25–50%', '50–75%', '75–90%', '90–100%'];

let B = null;     // данные из таблицы
let stack = [];   // история экранов: [{name, arg}]
let tab = 'checks';
let filt = { st: 'all', point: '' };

async function api(fn, ...args) {
  if (DEV) return DEV.call(fn, [initData, ...args]);
  if (!API) throw new Error('Не задан адрес сервера (config.js)');
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 45000);
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify({ fn, args: [initData, ...args] }), signal: ctl.signal });
    const j = await r.json();
    if (j.error) { const e = new Error(j.error); e.server = true; throw e; }
    return j.result;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Сервер долго не отвечает — попробуйте ещё раз');
    if (!e.server) throw new Error('Нет связи. Проверьте интернет');
    throw e;
  } finally { clearTimeout(t); }
}

function toast(t, ms) { document.querySelectorAll('.toast').forEach(x => x.remove()); const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms || 2600); }
function haptic(kind) { try { if (!TG || !TG.HapticFeedback) return; if (kind === 'success' || kind === 'error') TG.HapticFeedback.notificationOccurred(kind); else TG.HapticFeedback.impactOccurred(kind || 'light'); } catch (e) {} }
function modal(html) {
  const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = '<div class="sheet">' + html + '</div>';
  m.onclick = e => { if (e.target === m || e.target.closest('[data-close]')) m.remove(); };
  document.body.appendChild(m); return m;
}
function center(title, text, btn) {
  $app.innerHTML = '<div class="center">' + logo() + '<h2>' + esc(title) + '</h2><p>' + text + '</p>' + (btn || '') + '</div>';
}
function statusChip(c) {
  const m = { 'Назначена': 'warn', 'Отправлена': 'warn', 'Принята': '', 'Отказ': 'red', 'Сдана': 'ok', 'Отменена': '' };
  return '<span class="chip ' + (m[c.status] || '') + '">' + esc(c.status || 'Новая') + '</span>';
}
const pctColor = p => p >= 85 ? 'var(--ok)' : p >= 70 ? 'var(--warn)' : 'var(--accent)';
const pctChip = p => p == null ? '' : '<span class="chip ' + (p >= 85 ? 'ok' : p >= 70 ? 'warn' : 'red') + '">' + p + '%</span>';
const backBtn = () => '<button class="back" data-back aria-label="Назад"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>';

// ---------- навигация ----------
function go(name, arg) { stack.push({ name, arg }); render(); window.scrollTo(0, 0); }
function back() { if (stack.length > 1) { stack.pop(); render(); } }
function render() {
  const cur = stack[stack.length - 1];
  if (TG && TG.BackButton) { if (stack.length > 1) TG.BackButton.show(); else TG.BackButton.hide(); }
  (SCREENS[cur.name] || SCREENS.home)(cur.arg);
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-back]')) { back(); return; }
  const t = e.target.closest('[data-tab]');
  if (t) { tab = t.dataset.tab; stack = [{ name: 'home' }]; render(); }
});
function tabsBar() {
  const list = [];
  if (B.admin) list.push(['checks', '📋', 'Проверки'], ['points', '📍', 'Точки'], ['guests', '🕵️', 'Гости']);
  if (B.guest) list.push(['mine', '🗂️', B.admin ? 'Мои задания' : 'Задания']);
  if (list.length < 2) return '';
  return '<div class="tabs"><nav>' + list.map(([k, e, t]) => '<button data-tab="' + k + '" class="' + (tab === k ? 'on' : '') + '"><span class="e">' + e + '</span>' + t + '</button>').join('') + '</nav></div>';
}

// ---------- экраны ----------
const SCREENS = {
  home() {
    if (!B.admin) tab = 'mine';

};

function checksView() {

function pointsView() {

// ---------- задание и анкета (гость) ----------
const draftKey = id => 'mg-draft-' + uid + '-' + id;
const draftOf = id => ls.get(draftKey(id), null);
const OPENED = {};
async function loadCheck(id) {

    (B.admin && !['Сдана', 'Отменена'].includes(c.status) ? '<div style="margin-top:16px"><button class="btn line" id="cancel">Отменить проверку</button></div>' : '') + '</div>';
  const f = document.getElementById('fill'); if (f) f.onclick = () => go('form', id);
  const p = document.getElementById('peek'); if (p) p.onclick = () => modal('<h3>Что оценивать</h3><div style="max-height:60vh;overflow:auto">' + blocksOf(d.criteria).map(([b, l]) => '<div class="sec">' + esc(b) + '</div>' + l.map(k => '<div style="font-size:14px;margin:4px 0">• ' + esc(k.title) + '</div>').join('')).join('') + '</div><button class="btn" data-close style="margin-top:12px">Понятно</button>');

function blocksOf(crit) {
  const m = new Map();
  crit.forEach(k => { if (!m.has(k.block)) m.set(k.block, []); m.get(k.block).push(k); });
  return [...m.entries()];
}

let F = null; // открытая анкета: {id, d, dr, steps, step}
async function formView(id) {
  if (!F || F.id !== id) {
    $app.innerHTML = '<div class="center"><div class="spin"></div></div>';
    let d;
    try { d = await loadCheck(id); } catch (e) { center('Не открылось', esc(e.message), '<button class="btn" data-back>Назад</button>'); return; }
    if (!d.canFill) { center('Анкета закрыта', 'Это задание уже сдано или отменено.', '<button class="btn" data-back>Назад</button>'); return; }
    const dr = draftOf(id) || { answers: {}, visit: {}, step: 0 };
    F = { id, d, dr, steps: [['Визит', null]].concat(blocksOf(d.criteria)).concat([['Итог', null]]), step: Math.min(dr.step || 0, d.criteria.length + 1) };
  }
  drawStep();
}
function saveDraft() { F.dr.step = F.step; F.dr.at = Date.now(); if (!ls.set(draftKey(F.id), F.dr)) { F.dr.answers && Object.values(F.dr.answers).forEach(a => { delete a.th; }); ls.set(draftKey(F.id), F.dr); } }
function stepDone(i) {
  const [name, list] = F.steps[i];
  if (list) return list.every(k => { const a = F.dr.answers[k.no] || {}; return a.v && !(a.v === NO && B.needComment && !String(a.c || '').trim()); });
  if (name === 'Итог') return F.dr.visit.rating !== undefined && F.dr.visit.rating !== '';
  return true;
}
function drawStep() {
  const i = F.step, [name, list] = F.steps[i], last = i === F.steps.length - 1, v = F.dr.visit, c = F.d.check;
  let body = '';
  if (name === 'Визит') {
    body = '<div class="two"><label class="f"><span>Пришли в</span><input class="inp" type="time" data-v="from" value="' + esc(v.from || '') + '"></label><label class="f"><span>Ушли в</span><input class="inp" type="time" data-v="to" value="' + esc(v.to || '') + '"></label></div>' +
      '<div class="two"><label class="f"><span>Гостей за столом</span><input class="inp" inputmode="numeric" data-v="people" value="' + esc(v.people || '') + '"></label><label class="f"><span>Сумма чека, ₽</span><input class="inp" inputmode="numeric" data-v="sum" value="' + esc(v.sum || '') + '"></label></div>' +
      '<label class="f"><span>Официант (имя или приметы)</span><input class="inp" data-v="waiter" value="' + esc(v.waiter || '') + '"></label>' +
      '<label class="f"><span>Управляющий / менеджер в зале</span><input class="inp" data-v="manager" value="' + esc(v.manager || '') + '" placeholder="если видели"></label>' +
      '<label class="f"><span>Загрузка зала</span></label><div class="seg" data-seg="load">' + LOADS.map(x => '<button class="' + (v.load === x ? 'on' : '') + '">' + x + '</button>').join('') + '</div>' +
      '<div class="sec">Фото чека</div><div class="photos" id="rcpt">' + thumbs(v.receiptTh || []) + '<label class="ph" style="cursor:pointer">📷<input type="file" accept="image/*" hidden data-photo="receipt"></label></div>';
  } else if (name === 'Итог') {
    body = '<label class="f"><span>Общая оценка визита, 0–10</span></label><div class="seg" data-seg="rating">' + Array.from({ length: 11 }, (_, n) => '<button class="' + (String(v.rating) === String(n) ? 'on' : '') + '">' + n + '</button>').join('') + '</div>' +
      '<div class="two" style="margin-top:14px"><div><label class="f"><span>Порекомендуете «Лицей» знакомым?</span></label><div class="seg" data-seg="recommend">' + ['Да', 'Нет'].map(x => '<button class="' + (v.recommend === x ? 'on' : '') + '">' + x + '</button>').join('') + '</div></div>' +
      '<div><label class="f"><span>Придёте сами ещё раз?</span></label><div class="seg" data-seg="again">' + ['Да', 'Нет'].map(x => '<button class="' + (v.again === x ? 'on' : '') + '">' + x + '</button>').join('') + '</div></div></div>' +
      '<label class="f" style="margin-top:14px"><span>Общее впечатление и что улучшить</span><textarea class="inp" data-v="comment" style="min-height:120px">' + esc(v.comment || '') + '</textarea></label>' +
      '<div class="card"><div class="sec" style="margin-top:0">Проверка анкеты</div>' + F.steps.slice(1, -1).map(([b], j) => '<div style="display:flex;justify-content:space-between;font-size:14px;padding:3px 0"><span>' + esc(b) + '</span>' + (stepDone(j + 1) ? '<span class="chip ok">готово</span>' : '<button class="chip red" data-jump="' + (j + 1) + '">заполнить</button>') + '</div>').join('') + '</div>';
  } else {
    body = list.map(k => qCard(k)).join('');
  }
  $app.innerHTML = '<div class="view"><div class="head">' + backBtn() + '<h2>' + esc(c.point) + '</h2></div>' +
    '<div class="steps">' + F.steps.map((s, j) => '<i class="' + (j === i ? 'cur' : stepDone(j) && j < i ? 'done' : '') + '"></i>').join('') + '</div>' +
    '<div class="stepname">Шаг ' + (i + 1) + ' из ' + F.steps.length + ' · <b>' + esc(name) + '</b></div>' + body +
    '<div class="saved" id="saved">' + (F.dr.at ? 'Черновик сохранён на телефоне' : '') + '</div></div>' +
    '<div class="navbar"><div class="in">' + (i > 0 ? '<button class="btn ghost" id="prev">Назад</button>' : '') +
    '<button class="btn" id="next">' + (last ? 'Отправить анкету' : 'Далее') + '</button></div></div>';
  bindStep();
}
function thumbs(list) { return list.map((t, j) => '<div class="ph" style="background-image:url(' + t + ')"><b data-rm="' + j + '">×</b></div>').join(''); }
function qCard(k) {
  const a = F.dr.answers[k.no] || {};

  return '<div class="q" id="q' + k.no + '" data-no="' + k.no + '"><div class="qt"><span class="n">' + k.no + '.</span><span>' + esc(k.title) + '</span></div>' +
    (k.desc ? '<div class="qd clamp">' + esc(k.desc) + '</div>' + (k.desc.length > 150 ? '<button class="more" data-more>подробнее</button>' : '') : '<div style="height:10px"></div>') +
    '<div class="yn"><button class="y ' + (a.v === YES ? 'on' : '') + '" data-a="' + YES + '">Да</button><button class="n ' + (a.v === NO ? 'on' : '') + '" data-a="' + NO + '">Нет</button><button class="na ' + (a.v === NA ? 'on' : '') + '" data-a="' + NA + '">Не было</button></div>' +
    (showC ? '<div class="extra"><textarea class="inp" data-c placeholder="' + (a.v === NO ? 'Что именно было не так? Где, когда, кто' + (B.needComment ? ' (обязательно)' : '') : 'Комментарий') + '">' + esc(a.c || '') + '</textarea></div>' : '') +
    '<div class="photos">' + thumbs(a.th || []) + '</div>' +
    '<div class="tools">' + (!showC ? '<button data-addc>+ комментарий</button>' : '') + '<label style="cursor:pointer;color:var(--accent-dark)">📷 фото<input type="file" accept="image/*" hidden data-photo="' + k.no + '"></label></div></div>';
}
function bindStep() {
  const v = F.dr.visit;
  $app.querySelectorAll('[data-v]').forEach(el => el.oninput = () => { v[el.dataset.v] = el.value; saveDraft(); });
  $app.querySelectorAll('[data-seg]').forEach(seg => seg.querySelectorAll('button').forEach(b => b.onclick = () => {
    v[seg.dataset.seg] = v[seg.dataset.seg] === b.textContent ? '' : b.textContent; saveDraft(); haptic();
    seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.textContent === v[seg.dataset.seg]));
  }));
  $app.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => { F.step = Number(b.dataset.jump); saveDraft(); drawStep(); window.scrollTo(0, 0); });
  $app.querySelectorAll('.q').forEach(q => {
    const no = q.dataset.no, a = () => (F.dr.answers[no] = F.dr.answers[no] || {});
    q.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
      const was = a().v; a().v = was === b.dataset.a ? '' : b.dataset.a; saveDraft(); haptic();
      const k = F.d.criteria.find(x => String(x.no) === no);
      q.outerHTML = qCard(k); bindStep();
      if (a().v === NO && was !== NO) { const t = document.querySelector('#q' + no + ' [data-c]'); if (t) t.focus(); }
    });
    const t = q.querySelector('[data-c]'); if (t) t.oninput = () => { a().c = t.value; q.classList.remove('miss'); saveDraft(); };
    const ac = q.querySelector('[data-addc]'); if (ac) ac.onclick = () => { a().open = true; const k = F.d.criteria.find(x => String(x.no) === no); q.outerHTML = qCard(k); bindStep(); const tt = document.querySelector('#q' + no + ' [data-c]'); if (tt) tt.focus(); };
    const m = q.querySelector('[data-more]'); if (m) m.onclick = () => { q.querySelector('.qd').classList.remove('clamp'); m.remove(); };
    q.querySelectorAll('[data-rm]').forEach(x => x.onclick = () => { a().th.splice(x.dataset.rm, 1); a().p.splice(x.dataset.rm, 1); saveDraft(); const k = F.d.criteria.find(z => String(z.no) === no); q.outerHTML = qCard(k); bindStep(); });
  });
  const rc = document.getElementById('rcpt');
  if (rc) rc.querySelectorAll('[data-rm]').forEach(x => x.onclick = () => { v.receiptTh.splice(x.dataset.rm, 1); v.receipt.splice(x.dataset.rm, 1); saveDraft(); drawStep(); });
  $app.querySelectorAll('[data-photo]').forEach(inp => inp.onchange = () => addPhoto(inp));
  const prev = document.getElementById('prev'); if (prev) prev.onclick = () => { F.step--; saveDraft(); drawStep(); window.scrollTo(0, 0); };
  document.getElementById('next').onclick = () => {
    const [, list] = F.steps[F.step];
    if (list) {
      const miss = list.filter(k => { const a = F.dr.answers[k.no] || {}; return !a.v || (a.v === NO && B.needComment && !String(a.c || '').trim()); });
      if (miss.length) {
        miss.forEach(k => document.getElementById('q' + k.no).classList.add('miss'));
        document.getElementById('q' + miss[0].no).scrollIntoView({ behavior: 'smooth' });
        const a = F.dr.answers[miss[0].no] || {};
        toast(a.v === NO ? 'К ответу «Нет» напишите, что было не так' : 'Ответьте на все пункты: ' + miss.length + ' без ответа'); haptic('error'); return;
      }
    }
    if (F.step < F.steps.length - 1) { F.step++; saveDraft(); drawStep(); window.scrollTo(0, 0); return; }
    submit();
  };
}

/** Сжатие фото в JPEG ≤1280 px и загрузка на Диск; миниатюра остаётся в черновике. */
async function addPhoto(inp) {
  const file = inp.files && inp.files[0]; if (!file) return;
  const key = inp.dataset.photo, isRcpt = key === 'receipt';
  const holder = inp.closest('.q') ? inp.closest('.q').querySelector('.photos') : document.getElementById('rcpt');
  const tmp = document.createElement('div'); tmp.className = 'ph'; tmp.innerHTML = '<span class="spin sm"></span>'; holder.insertBefore(tmp, isRcpt ? holder.lastElementChild : null);
  try {
    const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error('Не удалось открыть фото')); i.src = URL.createObjectURL(file); });
    const draw = (max, q) => { const s = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); return cv.toDataURL('image/jpeg', q); };
    const full = draw(1280, .72), th = draw(160, .6);
    const r = await api('uploadPhoto', F.id, key, full);
    if (isRcpt) { const v = F.dr.visit; (v.receipt = v.receipt || []).push(r.id); (v.receiptTh = v.receiptTh || []).push(th); saveDraft(); drawStep(); }
    else {
      const a = (F.dr.answers[key] = F.dr.answers[key] || {}); (a.p = a.p || []).push(r.id); (a.th = a.th || []).push(th); saveDraft();
      const q = inp.closest('.q'), k = F.d.criteria.find(x => String(x.no) === key); q.outerHTML = qCard(k); bindStep();
    }
    haptic('success');
  } catch (e) { tmp.remove(); toast(e.message); }
}

async function submit() {
  const v = F.dr.visit;
  if (v.rating === undefined || v.rating === '') { toast('Поставьте общую оценку 0–10'); haptic('error'); return; }
  const bad = F.steps.findIndex((s, j) => j > 0 && !stepDone(j));
  if (bad > 0 && bad < F.steps.length - 1) { F.step = bad; drawStep(); toast('Не все пункты заполнены: ' + F.steps[bad][0]); return; }
  const btn = document.getElementById('next'); btn.disabled = true; btn.innerHTML = '<span class="spin sm"></span> Отправляю…';
  const answers = {};
  Object.keys(F.dr.answers).forEach(no => { const a = F.dr.answers[no]; answers[no] = { v: a.v, c: a.c || '', p: a.p || [] }; });
  const visit = Object.assign({}, v); delete visit.receiptTh;
  try {
    await api('submitCheck', F.id, { answers, visit });
    ls.del(draftKey(F.id)); haptic('success');
    const c = (B.checks || []).find(x => x.id === F.id); if (c) { c.status = 'Сдана'; c.done = new Date().toLocaleDateString('ru-RU'); }
    delete OPENED[F.id]; F = null;
    stack = [{ name: 'home' }, { name: 'thanks' }]; render();
  } catch (e) { btn.disabled = false; btn.textContent = 'Отправить анкету'; toast(e.message, 5000); haptic('error'); }
}

// ---------- отчёт (администратор) ----------
async function reportView(id) {
  $app.innerHTML = '<div class="view"><div class="head">' + backBtn() + '<h2>Итоги</h2></div><div class="center" style="min-height:40vh"><div class="spin"></div></div></div>';
  let r;
  try { r = await api('report', id); } catch (e) { $app.querySelector('.center').innerHTML = '<p>' + esc(e.message) + '</p>'; return; }
  const c = r.check, s = r.score, v = r.visit;
  const items = r.items;
  const fails = items.filter(i => i.answer === NO);
  const mk = a => a === YES ? '<span class="mk y">✓</span>' : a === NO ? '<span class="mk n">✕</span>' : '<span class="mk na">—</span>';
  const itemHtml = i => '<div class="it">' + mk(i.answer) + '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">' + i.no + '. ' + esc(i.title) + '</div>' + (i.comment ? '<div class="c">' + esc(i.comment) + '</div>' : '') +
    (i.photos.length ? '<div class="photos">' + i.photos.map(p => '<button class="ph" data-ph="' + esc(p) + '">📷</button>').join('') + '</div>' : '') + '</div><span class="w">вес ' + i.weight + '</span></div>';
  const groups = blocksOf(items.map(i => Object.assign({}, i)));
  $app.innerHTML = '<div class="view"><div class="head">' + backBtn() + '<h2>' + esc(c.point) + '</h2>' + statusChip(c) + '</div>' +
    '<div class="card"><div class="big"><div class="ring" style="--p:' + (s.pct || 0) + ';--c:' + pctColor(s.pct || 0) + '"><b>' + (s.pct == null ? '—' : s.pct + '%') + '</b></div><div><div style="font-weight:700">' + esc(c.date) + (c.time ? ', ' + esc(c.time) : '') + '</div>' +
    '<div class="mt" style="color:var(--muted);font-size:13px">' + esc(c.guest) + ' · ' + esc(c.id) + '</div><div style="margin-top:6px">' + (fails.length ? '<span class="chip red">нарушений: ' + fails.length + '</span> ' : '<span class="chip ok">без нарушений</span> ') +
    (v.rating !== '' ? '<span class="chip">оценка гостя ' + esc(v.rating) + '/10</span>' : '') + '</div></div></div>' +
    '<div class="bars">' + s.blocks.filter(b => b.pct != null).map(b => '<div class="bar"><div class="l"><span>' + esc(b.block) + '</span><span>' + b.pct + '%</span></div><div class="t"><i style="width:' + b.pct + '%;background:' + pctColor(b.pct) + '"></i></div></div>').join('') + '</div></div>' +
    '<div class="card"><dl class="kv">' + [['Время', [v.from, v.to].filter(String).join('–')], ['Гостей', v.people], ['Официант', v.waiter], ['Менеджер', v.manager], ['Загрузка', v.load], ['Чек', v.sum ? v.sum + ' ₽' : ''], ['Порекомендует', v.recommend], ['Придёт снова', v.again]]
      .filter(x => String(x[1] || '').trim()).map(x => '<dt>' + x[0] + '</dt><dd>' + esc(x[1]) + '</dd>').join('') + '</dl>' +
    (v.comment ? '<div class="sec" style="margin-top:14px">Комментарий гостя</div><div style="white-space:pre-wrap;font-size:14px">' + esc(v.comment) + '</div>' : '') +
    (r.folder ? '<div style="margin-top:10px;font-size:13px"><a href="' + esc(r.folder) + '" target="_blank" rel="noopener">Все фото на Google Диске</a></div>' : '') + '</div>' +
    (fails.length ? '<div class="sec">Нарушения</div><div class="card">' + fails.map(itemHtml).join('') + '</div>' : '') +
    '<div class="sec">Вся анкета</div>' + groups.map(([b, l]) => '<div class="card"><div style="font-weight:800;margin-bottom:4px">' + esc(b) + '</div>' + l.map(itemHtml).join('') + '</div>').join('') + '</div>';
  $app.querySelectorAll('[data-ph]').forEach(b => b.onclick = async () => {
    const m = modal('<div class="center" style="min-height:30vh"><div class="spin"></div></div>');
    try { const p = await api('getPhoto', b.dataset.ph); m.querySelector('.sheet').innerHTML = '<img src="' + p.data + '" alt="Фото гостя"><button class="btn" data-close>Закрыть</button>'; }
    catch (e) { m.querySelector('.sheet').innerHTML = '<p>' + esc(e.message) + '</p><button class="btn" data-close>Закрыть</button>'; }
  });
}

// ---------- регистрация ----------
function registerView() {
  const u = (() => { try { return JSON.parse(new URLSearchParams(initData).get('user')); } catch (e) { return {}; } })();
  $app.innerHTML = '<div class="view"><div class="hero"><div class="ornament">' + logo() + '</div>' + logo() + '<h1>Стать тайным гостем</h1><div class="sub">Заполните анкету — администратор свяжется с вами</div></div>' +
    '<label class="f"><span>Фамилия и имя</span><input class="inp" id="rName" autocomplete="name" value="' + esc([u.last_name, u.first_name].filter(Boolean).join(' ')) + '"></label>' +
    '<label class="f"><span>Телефон</span><input class="inp" id="rPhone" type="tel" autocomplete="tel" placeholder="+7 900 000-00-00"></label>' +
    '<label class="f"><span>О себе (необязательно)</span><textarea class="inp" id="rAbout" placeholder="Где работали, бывали ли в «Лицее», когда удобно ходить"></textarea></label>' +
    '<button class="btn" id="rGo">Отправить заявку</button></div>';
  document.getElementById('rGo').onclick = async e => {
    e.target.disabled = true;
    try { await api('register', { name: rName.value, phone: rPhone.value, about: rAbout.value }); haptic('success'); center('Заявка отправлена', 'Бот напишет, когда администратор её рассмотрит.'); }
    catch (err) { toast(err.message); e.target.disabled = false; }
  };
}

// ---------- запуск ----------
async function reload() { B = await api('boot'); return B; }
async function start() {
  if (TG) { try { TG.ready(); TG.expand(); TG.setHeaderColor && TG.setHeaderColor('#ffffff'); TG.BackButton && TG.BackButton.onClick(back); } catch (e) {} }
  if (!initData) { center('Тайный гость', 'Откройте приложение через бота в Telegram.'); return; }
  try { await reload(); } catch (e) {
    const m = e.message;
    if (m === 'NOT_REGISTERED') return registerView();
    if (m === 'PENDING') return center('Заявка на рассмотрении', 'Бот напишет, когда администратор её примет.');
    if (m === 'NO_ACCESS') return center('Нет доступа', 'Спасибо за интерес! Сейчас мы не можем предложить вам задания.');
    if (m === 'NO_TELEGRAM' || m === 'EXPIRED') return center('Откройте заново', 'Закройте приложение и откройте его кнопкой в боте.');
    return center('Не удалось загрузить', esc(m), '<button class="btn" onclick="location.reload()">Повторить</button>');
  }
  tab = B.admin ? 'checks' : 'mine';
  stack = [{ name: 'home' }];
  const open = new URLSearchParams(location.search).get('open') || (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param) || '';
  let m;
  if ((m = open.match(/^check-(.+)$/))) stack.push({ name: B.admin && !(B.checks || []).some(c => c.id === m[1]) ? 'check' : 'check', arg: m[1] });
  else if ((m = open.match(/^report-(.+)$/)) && B.admin) stack.push({ name: 'report', arg: m[1] });
  else if (open === 'new' && B.admin) stack.push({ name: 'newcheck' });
  if (B.admin && B.guest && (m = open.match(/^check-/))) tab = 'mine';
  render();
}
start();
</script>
